# Mosquitto for the Pulse machine monitor (compose profile `pulse`).
#
# Two clients only: `pulse-ingest` inside the stack, and `pulse-gateway`, the
# on-site gateway that bridges the factory's devices here. Devices never
# connect to this broker directly. docker-entrypoint.sh writes the password
# file from MQTT_INGEST_PASSWORD and MQTT_GATEWAY_PASSWORD on every start.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/generated/passwd
acl_file /mosquitto/generated/acl

# The ingest service keeps a persistent session (clean: false), so QoS 1
# messages wait here while it restarts. Persist them across a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# A backlog for a stopped ingest service: about 5 days of 5-second buckets
# from 10 devices. The default (1000) would drop counts after minutes.
max_queued_messages 100000
max_inflight_messages 100

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S

listener 1883
